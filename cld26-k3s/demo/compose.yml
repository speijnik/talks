# Dieselbe App mit docker compose, als Vergleich zu den Manifesten in k8s/
services:
  traefik:
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  demo:
    image: ghcr.io/speijnik/talks/cld26-k3s-demo:v1
    restart: always
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.demo.rule=PathPrefix(`/`)
      - traefik.http.services.demo.loadbalancer.server.port=8080
