name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni

      - name: Install dependencies
        run: |-
          cd cld25-netbird
          nci
          cd ../cld26-k3s
          nci

      - name: Build cld25-netbird
        run: |-
          cd cld25-netbird
          nr build --base /${{github.event.repository.name}}/cld25-netbird/

      - name: Build cld26-k3s
        run: |-
          cd cld26-k3s
          nr build --base /${{github.event.repository.name}}/cld26-k3s/

      - name: Prepare dist folder
        run: |-
         mkdir dist
         mv cld25-netbird/dist dist/cld25-netbird
         mv cld26-k3s/dist dist/cld26-k3s

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
