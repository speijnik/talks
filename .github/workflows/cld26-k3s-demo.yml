name: Build cld26-k3s demo images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cld26-k3s/demo/app/**

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: v1
            broken: "false"
          - version: v2
            broken: "false"
          - version: v3
            broken: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: cld26-k3s/demo/app
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ matrix.version }}
            BROKEN=${{ matrix.broken }}
          push: true
          tags: ghcr.io/${{ github.repository }}/cld26-k3s-demo:${{ matrix.version }}
